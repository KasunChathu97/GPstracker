<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Automatically reloads the web app every 10 seconds to fetch new coordinates -->
    <meta http-equiv="refresh" content="10">
    <title>Live GPS Tracker</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1e293b; text-align: center; font-size: 24px; }
        .data-box { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .card { background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; text-align: center; }
        .label { font-size: 12px; text-transform: uppercase; color: #64748b; font-weight: 600; }
        .value { font-size: 20px; font-weight: bold; color: #0f172a; margin-top: 5px; }
        iframe { width: 100%; height: 350px; border: none; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📡 Live GPS Tracker</h1>
    <div class="data-box">
        <div class="card"><div class="label">Latitude</div><div class="value" id="lat">0.000000</div></div>
        <div class="card"><div class="label">Longitude</div><div class="value" id="lng">0.000000</div></div>
    </div>
    <iframe id="mapFrame" src="about:blank"></iframe>
</div>

<script>
    // Extract query parameters (?lat=xxxx&lng=xxxx) sent from the ESP32 URL
    const urlParams = new URLSearchParams(window.location.search);
    const latitude = urlParams.get('lat') || "6.9271"; // Defaults to Sri Lanka if no data
    const longitude = urlParams.get('lng') || "79.8612";

    // Instantly inject numeric data into UI cards
    document.getElementById('lat').innerText = latitude;
    document.getElementById('lng').innerText = longitude;

    // Dynamically rebuild and apply a valid Google Maps embed source link
    const mapUrl = "https://google.com" + latitude + "," + longitude + "&t=&z=15&ie=UTF8&iwloc=&output=embed";
    document.getElementById('mapFrame').src = mapUrl;
</script>

</body>
</html>
