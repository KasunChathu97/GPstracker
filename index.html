<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Refresh page every 10 seconds -->
    <meta http-equiv="refresh" content="10">

    <title>Live GPS Tracker</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .container{
            width:100%;
            max-width:700px;
            background:#fff;
            border-radius:15px;
            padding:20px;
            box-shadow:0 5px 20px rgba(0,0,0,0.15);
        }

        h1{
            text-align:center;
            color:#0f172a;
            margin-bottom:20px;
        }

        .cards{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:15px;
            margin-bottom:20px;
        }

        .card{
            background:#f8fafc;
            border:1px solid #ddd;
            border-radius:10px;
            padding:15px;
            text-align:center;
        }

        .label{
            color:#666;
            font-size:14px;
            margin-bottom:8px;
        }

        .value{
            font-size:22px;
            font-weight:bold;
            color:#2563eb;
        }

        iframe{
            width:100%;
            height:450px;
            border:none;
            border-radius:10px;
        }

        .status{
            margin-top:15px;
            text-align:center;
            color:green;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📡 Live GPS Tracker</h1>

    <div class="cards">

        <div class="card">
            <div class="label">Latitude</div>
            <div class="value" id="lat">Loading...</div>
        </div>

        <div class="card">
            <div class="label">Longitude</div>
            <div class="value" id="lng">Loading...</div>
        </div>

    </div>

    <iframe id="mapFrame"></iframe>

    <div class="status" id="status">
        Waiting for GPS data...
    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const latitude = params.get("lat") || "6.9271";
const longitude = params.get("lng") || "79.8612";

// Show coordinates
document.getElementById("lat").textContent = latitude;
document.getElementById("lng").textContent = longitude;

// Google Maps Embed URL (No API Key Required)
const mapUrl =
`https://maps.google.com/maps?q=${latitude},${longitude}&z=16&output=embed`;

document.getElementById("mapFrame").src = mapUrl;

// Status message
if(params.has("lat") && params.has("lng")){
    document.getElementById("status").innerHTML =
    "✅ Live GPS coordinates received successfully.";
}else{
    document.getElementById("status").innerHTML =
    "⚠ No GPS coordinates found. Showing default location.";
}

</script>

</body>
</html>
